name: 🧪 Automated Unit Tests & Coverage CI

on:
  push:
    branches: [ main, master, develop, release/* ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: 🧪 300 Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    env:
      SECRET_KEY: 'ci-secret-key-for-automated-github-actions-tests-1234567890'
      DEBUG: 'False'
      USE_SQLITE_FOR_TESTS: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install coverage openpyxl pytest pytest-django

      - name: 🔍 Run Django Configuration & System Checks
        working-directory: ./backend
        run: |
          python manage.py check --deploy
          python manage.py check

      - name: 🧪 Execute 300 Unit Tests with Code Coverage
        working-directory: ./backend
        run: |
          coverage run manage.py test --verbosity=2
          coverage xml -o coverage.xml
          coverage html -d htmlcov
          coverage report -m

      - name: 📊 Generate Test Results & Excel Reports
        working-directory: ./Unit Test Results
        run: |
          python generate_unit_test_reports.py

      - name: 📤 Upload Coverage HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage-html
          path: backend/htmlcov/
          retention-days: 14

      - name: 📤 Upload Unit Test Inventory Excel Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-excel-report
          path: Unit Test Results/unit-tests-inventory.xlsx
          retention-days: 30

      - name: 📤 Upload Security & Vulnerability Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-test-results
          path: Vulnerability Test Results/
          retention-days: 30
