name: Security Review

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  detect-stack:
    name: Detect Backend Stack
    runs-on: ubuntu-latest
    outputs:
      backend_lang: ${{ steps.detect.outputs.lang }}
      backend_framework: ${{ steps.detect.outputs.framework }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend technology
        id: detect
        run: |
          if [ -f backend/requirements.txt ] || [ -f backend/setup.py ] || [ -f backend/pyproject.toml ]; then
            echo "lang=python" >> $GITHUB_OUTPUT
            if grep -qi django backend/requirements.txt 2>/dev/null; then
              echo "framework=django" >> $GITHUB_OUTPUT
            elif grep -qi flask backend/requirements.txt 2>/dev/null; then
              echo "framework=flask" >> $GITHUB_OUTPUT
            elif grep -qi fastapi backend/requirements.txt 2>/dev/null; then
              echo "framework=fastapi" >> $GITHUB_OUTPUT
            else
              echo "framework=python-generic" >> $GITHUB_OUTPUT
            fi
          elif [ -f backend/package.json ]; then
            echo "lang=javascript" >> $GITHUB_OUTPUT
            if grep -qi express backend/package.json 2>/dev/null; then
              echo "framework=express" >> $GITHUB_OUTPUT
            elif grep -qi nestjs backend/package.json 2>/dev/null; then
              echo "framework=nestjs" >> $GITHUB_OUTPUT
            else
              echo "framework=node-generic" >> $GITHUB_OUTPUT
            fi
          elif [ -f backend/pom.xml ] || [ -f backend/build.gradle ]; then
            echo "lang=java" >> $GITHUB_OUTPUT
            echo "framework=spring" >> $GITHUB_OUTPUT
          elif [ -f backend/go.mod ]; then
            echo "lang=go" >> $GITHUB_OUTPUT
            echo "framework=go-generic" >> $GITHUB_OUTPUT
          else
            echo "lang=unknown" >> $GITHUB_OUTPUT
            echo "framework=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Print detected stack
        run: |
          echo "Language: ${{ steps.detect.outputs.lang }}"
          echo "Framework: ${{ steps.detect.outputs.framework }}"

  sast-semgrep:
    name: SAST — Semgrep
    needs: detect-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SARIF)
        run: |
          semgrep scan \
            --config auto \
            --config p/django \
            --config p/python \
            --config p/jwt \
            --config p/secrets \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep-results.sarif \
            backend/ || true

      - name: Generate text report
        run: |
          semgrep scan \
            --config auto \
            --config p/django \
            --config p/python \
            --text \
            --output semgrep-results.txt \
            backend/ || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep-results.sarif
            semgrep-results.txt

  sast-bandit:
    name: SAST — Bandit (Python)
    needs: detect-stack
    if: needs.detect-stack.outputs.backend_lang == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit
        run: |
          bandit -r backend/ \
            -f sarif \
            -o bandit-results.sarif \
            --exclude backend/venv,backend/migrations \
            --severity-level medium || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-results.sarif

  dependency-scan:
    name: Dependency Scan — Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: backend/
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Run Trivy (table format)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: backend/
          format: table
          output: trivy-results.txt
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: |
            trivy-results.sarif
            trivy-results.txt

  secret-scan:
    name: Secret Scan — Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore

  security-summary:
    name: Security Summary
    needs: [sast-semgrep, sast-bandit, dependency-scan, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: reports/

      - name: Generate Summary
        run: |
          echo '## 🔒 Security Review Summary' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| Scan | Status |' >> $GITHUB_STEP_SUMMARY
          echo '|------|--------|' >> $GITHUB_STEP_SUMMARY
          echo '| Semgrep SAST | ${{ needs.sast-semgrep.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Bandit SAST | ${{ needs.sast-bandit.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Trivy Dependencies | ${{ needs.dependency-scan.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Gitleaks Secrets | ${{ needs.secret-scan.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '### Reports' >> $GITHUB_STEP_SUMMARY
          echo 'Download scan reports from the workflow artifacts.' >> $GITHUB_STEP_SUMMARY

      - name: Upload consolidated reports
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: security-review-reports
          path: reports/

      - name: Fail on critical findings
        run: |
          if [ -f reports/semgrep-report/semgrep-results.sarif ]; then
            CRITICAL=$(python3 -c "import json; data = json.load(open('reports/semgrep-report/semgrep-results.sarif')); print(sum(1 for run in data.get('runs', []) for r in run.get('results', []) if r.get('level') == 'error'))" 2>/dev/null || echo 0)
            echo "Semgrep critical findings: $CRITICAL"
            if [ "$CRITICAL" -gt 0 ] 2>/dev/null; then
              echo "::error::Found $CRITICAL critical SAST findings"
              exit 1
            fi
          fi
