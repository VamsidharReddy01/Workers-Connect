name: 🌐 Selenium E2E Tests CI
on:
  push:
    branches: [ main, master, develop, release/* ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: 🌐 300 Selenium E2E Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    env:
      SECRET_KEY: 'ci-secret-key-for-automated-github-actions-tests-1234567890'
      DEBUG: 'False'
      USE_SQLITE_FOR_TESTS: 'True'
      SECURE_SSL_REDIRECT: 'False'
      SESSION_COOKIE_SECURE: 'False'
      CSRF_COOKIE_SECURE: 'False'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 🌐 Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install coverage openpyxl

      - name: 🔍 Run Django System Checks
        working-directory: ./backend
        run: |
          python manage.py check --deploy
          python manage.py check

      - name: 🌐 Execute 300 Selenium E2E Tests with Coverage
        working-directory: ./backend
        run: |
          coverage run manage.py test selenium_tests --verbosity=2
          coverage xml -o coverage-selenium.xml
          coverage html -d htmlcov-selenium
          coverage report -m

      - name: 📊 Generate Selenium Test Reports
        working-directory: ./Selenium Test Results
        run: |
          python generate_selenium_test_reports.py

      - name: 📤 Upload Selenium Coverage HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-coverage-html
          path: backend/htmlcov-selenium/
          retention-days: 14

      - name: 📤 Upload Selenium Test Inventory Excel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-tests-excel-report
          path: Selenium Test Results/selenium-tests-inventory.xlsx
          retention-days: 30
